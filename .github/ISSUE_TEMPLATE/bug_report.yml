name: Bug report
description: Report a reproducible SurfaceScope defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials, client data or third-party scan results.
        For a vulnerability in SurfaceScope itself, use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: SurfaceScope version
      description: Output of `surfacescope --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and OS
      description: For example, Python 3.12.2 on Windows 11 or Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal command and synthetic/loopback fixture
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the traceback or sanitized output
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Safety check
      options:
        - label: I used a loopback or synthetic target and removed sensitive data.
          required: true
